services:
  web:
    build: .
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: always

  backend:
    build: ./server
    ports:
      - "3000:3000"
    volumes:
      - ../persistent/data:/app/data
      - ../persistent/uploads:/app/uploads
    env_file:
      - ./server/.env
    restart: always
