name: Deploy to DigitalOcean

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            # Go to the git root folder (adjust if your folder name is different)
            cd ~/mxrjup
            
            # Create persistent directories for data storage
            mkdir -p persistent/data
            mkdir -p persistent/uploads
            chmod -R 777 persistent
            
            # Force sync with remote to discard local changes/conflicts
            git fetch origin
            git reset --hard origin/main
            
            # Go into the project folder where docker-compose.yml is
            cd personal-site
            
            # Restart the app
            docker compose up -d --build
            
            # Optional: Clean up old unused images to save space
            docker system prune -f
